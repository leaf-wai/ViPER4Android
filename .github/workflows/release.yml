name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0); leave empty to use versionName from app/build.gradle.kts"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v${APP_VERSION}}"
          else
            TAG="$REF_NAME"
          fi

          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"

          if [ "$VERSION" != "$APP_VERSION" ] && [ "${VERSION%%-*}" != "$APP_VERSION" ]; then
            echo "::warning::Release tag (${TAG}) does not match app/build.gradle.kts versionName (${APP_VERSION}). In-app UpdateChecker compares installed versionName against tag_name."
          fi

          PRERELEASE="false"
          if [[ "$TAG" == *-* ]] || [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub Secret: ${var}"
              exit 1
            fi
          done

          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          echo "path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Verify APK signature and prepare assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "::error::Signed release APK not found at ${SRC_APK}"
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$SRC_APK"
          fi

          mkdir -p release-assets
          OUT_NAME="ViPER4Android-${VERSION}.apk"
          cp "$SRC_APK" "release-assets/${OUT_NAME}"
          (cd release-assets && sha256sum "${OUT_NAME}" > "${OUT_NAME}.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ViPER4Android ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.sha256
