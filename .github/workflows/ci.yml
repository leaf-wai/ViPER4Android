name: CI

on:
  push:
    branches:
      - main
      - miuix
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Lint and Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Debug APK artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk "apk/ViPER4Android-${VERSION}-${SHORT_SHA}-debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android-debug-apk
          path: apk/*.apk
          retention-days: 7
